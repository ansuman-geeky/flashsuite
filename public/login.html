<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3B61CKGJL7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3B61CKGJL7');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | FlashSuite Custom URL Shortener & QR Code Generator</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page-body" style="flex-direction: column; align-items: stretch; justify-content: flex-start; padding: 0;">

    <!-- Navigation -->
    <nav class="glass-nav">
        <a href="/"><img src="flashsuite_logo.png" alt="FlashSuite Logo" class="nav-logo"></a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/#hero">URL Shortener</a>
            <a href="/#hero">QR Generator</a>
            <a href="/pdftools">PDF Tools</a>
        </div>
        <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay" onclick="toggleMobileMenu()"></div>
    <div class="mobile-menu" id="mobileMenu">
        <a href="/" onclick="toggleMobileMenu()">Home</a>
        <a href="/#hero" onclick="toggleMobileMenu()">URL Shortener</a>
        <a href="/#hero" onclick="toggleMobileMenu()">QR Generator</a>
        <a href="/pdftools" onclick="toggleMobileMenu()">PDF Tools</a>
    </div>

    <div class="login-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div class="login-card">
            <a href="/"><img src="flashsuite_logo.png" alt="FlashSuite Logo" class="login-logo"></a>
            <h2>Admin Portal</h2>

        <form id="loginForm">
            <div class="login-form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="login-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
        </form>

        <p class="login-error-msg" id="errorMsg">Invalid credentials. Please try again.</p>
    </div>
    </div>

    <script>
        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
            document.getElementById('mobileMenuOverlay').classList.toggle('active');
        }
    </script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (res.ok) {
                    window.location.href = '/admin.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>

</html>
