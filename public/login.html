        </div>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const currentPath = window.location.pathname;
                document.querySelectorAll('nav a.nav-link').forEach(link => {
                    const href = link.getAttribute('href');
                    let isActive = false;

                    if (currentPath === href) {
                        isActive = true;
                    } else if (href !== '/' && currentPath.startsWith(href)) {
                        isActive = true;
                    } else if (href === '/pdftools' && currentPath.includes('pdf')) {
                        isActive = true;
                    }

                    if (isActive) {
                        link.className = "nav-link font-body-md text-body-md text-primary font-bold border-b-2 border-primary pb-1";
                        // Also handle mobile menu links
                        if (link.classList.contains('py-2')) {
                            link.className = "nav-link font-body-lg text-primary font-bold py-2";
                        }
                    } else {
                        link.className = "nav-link font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors";
                        if (link.classList.contains('py-2')) {
                            link.className = "nav-link font-body-lg text-on-surface-variant hover:text-primary transition-colors py-2";
                        }
                    }
                });
            });

            function toggleMobileMenu() {
                const menu = document.getElementById('mobileMenu');
                const overlay = document.getElementById('mobileMenuOverlay');
                if (menu.classList.contains('translate-x-full')) {
                    menu.classList.remove('translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    menu.classList.add('translate-x-full');
                    overlay.classList.add('hidden');
                }
            }
        </script>

    <main class="pt-20 pb-16 min-h-screen"><div class="login-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div class="login-card">
            <a href="/"><img src="flashsuite_logo.png" alt="FlashSuite Logo" class="login-logo"></a>
            <h2>Admin Portal</h2>

        <form id="loginForm">
            <div class="login-form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required="" autocomplete="username">
            </div>
            <div class="login-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required="" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
        </form>

        <p class="login-error-msg" id="errorMsg">Invalid credentials. Please try again.</p>
    </div>
    </div></main>

    <script>
        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
            document.getElementById('mobileMenuOverlay').classList.toggle('active');
        }
    </script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (res.ok) {
                    window.location.href = '/admin.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
