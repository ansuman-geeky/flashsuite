    <style>
        .blog-hero {
            text-align: center;
            padding: 80px 20px 40px;
        }

        .blog-grid {
            max-width: 1400px;
            margin: 0 auto 80px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .blog-card {
            background: var(--white);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1;
            box-sizing: border-box;
            overflow: hidden;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06);
        }

        .blog-card-image-wrapper {
            margin: -20px -20px 12px -20px;
            height: 110px;
            overflow: hidden;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .blog-card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .blog-card:hover .blog-card-image {
            transform: scale(1.05);
        }

        .blog-card-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
        }

        .blog-card h2 {
            margin-top: 0;
            color: var(--secondary);
            font-size: 1.15rem;
            margin-bottom: 8px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .blog-meta {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: inline-block;
            background: rgba(157, 28, 68, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            align-self: flex-start;
        }

        .blog-card-text {
            line-height: 1.4;
            color: #555;
            font-size: 0.85rem;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more-btn {
            align-self: flex-start;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: auto;
            text-decoration: none;
            text-align: center;
            width: fit-content;
        }

        .read-more-btn:hover {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 1200px) {
            .blog-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .blog-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>

<body class="bg-mesh font-body-md text-on-surface antialiased">    <div id="navbar-placeholder"></div>

    <!-- Hero Section -->
    <main class="pt-20 pb-16 min-h-screen"><div class="hero-wrapper">
        <div class="container blog-hero fade-in-up">
            <h1 style="font-size: 3.5rem; color: var(--secondary); margin-bottom: 20px;">Insights &amp; Updates</h1>
            <p style="font-size: 1.25rem; color: #555; max-width: 600px; margin: 0 auto; line-height: 1.6;">
                Discover the latest trends in digital marketing, product updates, and how to maximize your link
                strategy.
            </p>
        </div>
    </div><main class="blog-grid fade-in-up delay-1" id="blogContainer">
        <p style="text-align: center; color: #888;"><em>Loading posts...</em></p>
    </main></main>

    <!-- Blog Content -->
    

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/blogs');
                const blogs = await res.json();

                const container = document.getElementById('blogContainer');

                if (blogs.length === 0) {
                    container.innerHTML = '<div class="blog-card" style="text-align: center;"><h2 style="color: #888;">No Posts Yet</h2><p style="color: #888; font-size: 1.1rem;">Check back soon for the latest updates and insights from the FlashSuite team.</p></div>';
                    return;
                }

                container.innerHTML = blogs.map(blog => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(blog.content, 'text/html');
                    
                    // Extract first image
                    const imgEl = doc.querySelector('img');
                    const imgSrc = imgEl ? imgEl.getAttribute('src') : null;
                    
                    // Extract clean text preview
                    doc.querySelectorAll('style, script, head, header, footer').forEach(el => el.remove());
                    const cleanText = doc.body ? doc.body.textContent.trim() : doc.documentElement.textContent.trim();
                    const textPreview = cleanText.length > 70 ? cleanText.substring(0, 70) + '...' : cleanText;

                    return `
                        <article class="blog-card">
                            <div class="blog-card-image-wrapper">
                                <img src="${imgSrc || 'https://images.unsplash.com/photo-1432821596592-e2c18b78144f?auto=format&fit=crop&q=80&w=600'}" alt="${blog.title}" class="blog-card-image">
                            </div>
                            <div class="blog-card-content">
                                <span class="blog-meta">${new Date(blog.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</span>
                                <h2 title="${blog.title}">${blog.title}</h2>
                                <p class="blog-card-text">${textPreview}</p>
                                <a href="/post.html?id=${blog.id}" class="read-more-btn">Read More</a>
                            </div>
                        </article>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('blogContainer').innerHTML = '<div class="blog-card" style="text-align: center;"><p style="color: #cc0000; font-size: 1.1rem;">Failed to load posts. Please try again later.</p></div>';
            }
        });
    </script>
